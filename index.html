<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Die große LMG Sinnsuche</title>
<style>
  :root {
    --bg: #f6f1e7;
    --ink: #22201c;
    --muted: #6b655a;
    --card: #fffdf8;
    --line: #d9d0bd;
    --z1: #2f9e6b; --z1bg: #e3f4ea;
    --z2: #d49a1c; --z2bg: #fbf1d6;
    --z3: #d9722b; --z3bg: #fbe5d3;
    --z4: #c2384a; --z4bg: #f9dde0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19; --ink: #f1ede4; --muted: #a39d8f; --card: #2b2926; --line: #46423b;
      --z1bg: #1d3328; --z2bg: #38301a; --z3bg: #3a2818; --z4bg: #3b1f24;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { margin: 0; font-size: clamp(1.5rem, 3.6vw, 2.4rem); letter-spacing: -.02em; }
  h1 small { display: block; font-size: .9rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 2px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; min-height: 44px; }
  button:active { transform: scale(.97); }
  button.on { background: var(--ink); color: var(--bg); }

  main { display: grid; grid-template-columns: 1fr; gap: 14px; }

  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .zone { border: 2.5px dashed var(--c); background: var(--bg2); border-radius: 18px; padding: 10px; min-height: 190px;
    display: flex; flex-direction: column; transition: background .15s, transform .15s; }
  .zone.hot { transform: scale(1.015); background: color-mix(in srgb, var(--c) 22%, var(--bg2)); border-style: solid; }
  .zone h2 { margin: 0 0 8px; font-size: 1.05rem; color: var(--c); display: flex; justify-content: space-between; align-items: baseline; }
  .zone h2 span { font-size: .8rem; opacity: .8; font-weight: 600; }
  .zone .cards { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; flex: 1; }
  .z1 { --c: var(--z1); --bg2: var(--z1bg); } .z2 { --c: var(--z2); --bg2: var(--z2bg); }
  .z3 { --c: var(--z3); --bg2: var(--z3bg); } .z4 { --c: var(--z4); --bg2: var(--z4bg); }

  .pool { border: 2px solid var(--line); border-radius: 18px; padding: 10px; background: color-mix(in srgb, var(--card) 60%, var(--bg)); }
  .pool h2 { margin: 0 0 8px; font-size: .95rem; color: var(--muted); }
  .pool .cards { display: flex; flex-wrap: wrap; gap: 7px; min-height: 60px; }
  .pool.hot { border-color: var(--ink); }
  .done { text-align: center; color: var(--muted); font-weight: 600; padding: 14px 4px; width: 100%; }

  .card { font-size:.9rem; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 11px; font-size: .95rem; line-height: 1.2;
    box-shadow: 0 2px 0 rgba(0,0,0,.08); touch-action: none; cursor: grab; display: flex; gap: 7px; align-items: center; position: relative; }
  .card .e { font-size: 1.25rem; }
  .card.drag { position: fixed; z-index: 1000; pointer-events: none; box-shadow: 0 14px 30px rgba(0,0,0,.28); transform: rotate(-3deg) scale(1.06); cursor: grabbing; margin: 0; }
  .card.ghost { opacity: .35; }
  .card .tip { position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--card); display: none; }
  body.show .card .tip { display: block; }
  .tip.t1 { background: var(--z1); } .tip.t2 { background: var(--z2); } .tip.t3 { background: var(--z3); } .tip.t4 { background: var(--z4); }

  #msg { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); display: none; line-height: 1.45; }
  #msg.show { display: block; }
  #msg b { display: block; margin-bottom: 4px; }
  footer { margin-top: 14px; font-size: .8rem; color: var(--muted); text-align: center; }
  .legend { font-size: .8rem; color: var(--muted); margin: -4px 0 10px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin: 0 3px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Die große LMG Sinnsuche<small>Ziehe jede Karte in das Feld, das du für richtig hältst.</small></h1>
  <div class="tools">
    <button id="check">Auswerten</button>
    <button id="tips">Mein Vorschlag</button>
    <button id="reset">Neu mischen</button>
  </div>
</header>

<main>
  <aside class="pool" data-z="0"><h2>Noch einzusortieren</h2><div class="cards" id="pool"></div></aside>
  <section class="zones" id="zones">
    <div class="zone z1" data-z="1"><h2>Sehr sinnvoll <span></span></h2><div class="cards"></div></div>
    <div class="zone z2" data-z="2"><h2>Vielleicht sinnvoll <span></span></h2><div class="cards"></div></div>
    <div class="zone z3" data-z="3"><h2>Eher sinnlos <span></span></h2><div class="cards"></div></div>
    <div class="zone z4" data-z="4"><h2>Blödsinn <span></span></h2><div class="cards"></div></div>
  </section>
</main>

<div id="msg"></div>
<footer>Sinnfrage, EF Philosophie · Karten per Finger oder Maus verschieben · Es gibt keine „richtige" Lösung, nur gute Begründungen.</footer>

<script>
(function () {
  // t = Vorschlag (1 sehr sinnvoll ... 4 Blödsinn)
  const THINGS = [
    { e: "🪥", t: "Zähne putzen", s: 1 },
    { e: "🤝", t: "Einem Freund in der Not helfen", s: 1 },
    { e: "🧠", t: "Den eigenen Standpunkt mit Argumenten begründen", s: 1 },
    { e: "🏛️", t: "Nach dem gelungenen Leben suchen (Aristoteles: Eudaimonia)", s: 1 },
    { e: "⚖️", t: "Prüfen, ob man wollen kann, dass alle so handeln (Kant)", s: 1 },
    { e: "🍳", t: "Frühstücken", s: 2 },
    { e: "🛏️", t: "Jeden Morgen das Bett machen", s: 2 },
    { e: "🏃", t: "Zum Bus rennen, der schon abfährt", s: 2 },
    { e: "🔎", t: "Den Sinn des Lebens googeln", s: 2 },
    { e: "📱", t: "Zwei Stunden Kurzvideos scrollen", s: 3 },
    { e: "🪨", t: "Wie Sisyphos einen Stein den Berg hinaufrollen", s: 3 },
    { e: "🔢", t: "Die Sandkörner am Strand zählen", s: 3 },
    { e: "👕", t: "Eine Hose bügeln, die man gleich in den Schrank legt", s: 3 },
    { e: "🍕", t: "Mit einer Tiefkühlpizza über den Sinn des Seins diskutieren", s: 4 },
    { e: "🧦", t: "Socken nach Charakter sortieren und ihnen Namen geben", s: 4 }
  ];
  const LABEL = { 1: "sehr sinnvoll", 2: "vielleicht sinnvoll", 3: "eher sinnlos", 4: "Blödsinn" };
  const KEY = "lmg-sinnsuche-v1";

  const pool = document.getElementById("pool");
  const zoneEls = [...document.querySelectorAll(".zone")];
  const cardsOf = z => (z === 0 ? pool : zoneEls[z - 1].querySelector(".cards"));
  const dropTargets = () => [...zoneEls, document.querySelector(".pool")];
  const msg = document.getElementById("msg");

  const els = THINGS.map((th, i) => {
    const d = document.createElement("div");
    d.className = "card"; d.dataset.i = i; d.dataset.z = 0;
    d.innerHTML = `<span class="e">${th.e}</span><span>${th.t}</span><i class="tip t${th.s}"></i>`;
    return d;
  });

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function place(el, z) { el.dataset.z = z; cardsOf(z).appendChild(el); }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(els.map(e => +e.dataset.z))); } catch (_) {} }
  function updateCounts() {
    zoneEls.forEach((z, k) => { z.querySelector("h2 span").textContent = cardsOf(k + 1).children.length || ""; });
    const left = pool.querySelectorAll(".card").length;
    let d = pool.querySelector(".done");
    if (!left) { if (!d) { d = document.createElement("div"); d.className = "done"; d.textContent = "Alles sortiert. Jetzt auswerten!"; pool.appendChild(d); } }
    else if (d) d.remove();
  }
  function refresh() { updateCounts(); save(); }

  function init(restore) {
    let saved = null;
    if (restore) { try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (_) {} }
    const order = shuffle([...els.keys()]);
    order.forEach(i => place(els[i], saved && saved.length === els.length ? saved[i] : 0));
    msg.className = ""; document.body.classList.remove("show"); tipsBtn.classList.remove("on");
    refresh();
  }

  // ----- Drag & Drop (Pointer Events: Maus, Finger, Apple Pencil) -----
  let drag = null;
  document.addEventListener("pointerdown", e => {
    const card = e.target.closest(".card");
    if (!card || drag) return;
    e.preventDefault();
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.add("drag");
    ghost.style.width = r.width + "px";
    document.body.appendChild(ghost);
    card.classList.add("ghost");
    drag = { card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, id: e.pointerId };
    move(e);
  });
  function move(e) {
    drag.ghost.style.left = (e.clientX - drag.dx) + "px";
    drag.ghost.style.top = (e.clientY - drag.dy) + "px";
    const t = targetAt(e.clientX, e.clientY);
    dropTargets().forEach(x => x.classList.toggle("hot", x === t));
  }
  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest(".zone, .pool");
  }
  document.addEventListener("pointermove", e => { if (drag && e.pointerId === drag.id) { e.preventDefault(); move(e); } }, { passive: false });
  function end(e, cancel) {
    if (!drag || e.pointerId !== drag.id) return;
    const t = cancel ? null : targetAt(e.clientX, e.clientY);
    dropTargets().forEach(x => x.classList.remove("hot"));
    drag.ghost.remove(); drag.card.classList.remove("ghost");
    if (t) { place(drag.card, +t.dataset.z); msg.className = ""; refresh(); }
    drag = null;
  }
  document.addEventListener("pointerup", e => end(e, false));
  document.addEventListener("pointercancel", e => end(e, true));
  document.addEventListener("contextmenu", e => e.preventDefault());

  // ----- Buttons -----
  const tipsBtn = document.getElementById("tips");
  tipsBtn.onclick = () => { document.body.classList.toggle("show"); tipsBtn.classList.toggle("on"); };
  document.getElementById("reset").onclick = () => init(false);
  document.getElementById("check").onclick = () => {
    const placed = els.filter(e => +e.dataset.z > 0);
    if (placed.length < els.length) {
      msg.innerHTML = `<b>Noch ${els.length - placed.length} Karte(n) übrig.</b>Sortiere erst alles ein, dann gibt es eine Auswertung.`;
      msg.className = "show"; return;
    }
    const d = els.map(e => Math.abs(+e.dataset.z - THINGS[+e.dataset.i].s));
    const same = d.filter(x => x === 0).length;
    const far = els.filter((e, k) => d[k] >= 2).map(e => THINGS[+e.dataset.i].t);
    const counts = [1, 2, 3, 4].map(z => `${LABEL[z]}: ${cardsOf(z).children.length}`).join(" · ");
    let text = `<b>${same} von ${els.length} Karten liegen wie in meinem Vorschlag.</b>${counts}<br><br>`;
    if (far.length) text += `Deutlich anders als mein Vorschlag: „${far.slice(0, 3).join("“, „")}“${far.length > 3 ? " …" : ""}. Kannst du begründen, nach welchem Maßstab du sortiert hast?<br><br>`;
    text += `<b>Zum Nachdenken:</b>Wer entscheidet, was „sinnvoll" ist: nützlich, moralisch richtig, glücklich machend oder von dir selbst gewählt? Je nach Maßstab (Aristoteles, Kant, Camus) wandern die Karten in andere Felder.`;
    msg.innerHTML = text; msg.className = "show"; msg.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  init(true);
})();
</script>
</body>
</html>
